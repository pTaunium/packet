name: package-request
description: Submit one or more URLs to package into a Docker image on GHCR
title: "[package] "
labels: ["package-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📦 Package Request
        Provide one or more URLs and the files will be downloaded and packaged into a minimal Docker image on GHCR.

  - type: textarea
    id: urls
    attributes:
      label: Download URLs
      description: "One or more HTTP(S) URLs to package (one URL per line)."
      placeholder: |
        https://github.com/owner/repo/releases/download/v1.0.0/file1.tar.gz
        https://github.com/owner/repo/releases/download/v1.0.0/file2.bin
    validations:
      required: true

  - type: input
    id: tag
    attributes:
      label: Image tag (optional)
      description: Custom tag for the image. Defaults to the issue number if left blank.
      placeholder: "my-bundle-v1.0.0"
    validations:
      required: false

  - type: textarea
    id: sha256
    attributes:
      label: SHA256 checksums (optional)
      description: "Optional SHA256 hashes to verify. You can provide hashes (one per line, in the same order as URLs) or standard checksum lines like '<hash>  <filename>'."
      placeholder: |
        e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    validations:
      required: false
